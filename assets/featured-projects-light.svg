<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 64" width="960" height="64" role="img" aria-label="FEATURED PROJECTS">
  <title>FEATURED PROJECTS</title>
  <defs>
    <mask id="cut"><rect width="960" height="64" rx="10" fill="#fff"/><circle cx="92" cy="0" r="9" fill="#000"/><circle cx="92" cy="64" r="9" fill="#000"/></mask>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1565C0" stop-opacity="0.55"/><stop offset="0.6" stop-color="#1565C0" stop-opacity="0"/></linearGradient>
    <linearGradient id="u" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6FA8FF"/><stop offset="1" stop-color="#4FE3C1" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .m { font-family: ui-monospace, SFMono-Regular, "Cascadia Mono", Menlo, Consolas, monospace; }
      .s { font-family: system-ui, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      @media (max-width: 640px) { .cap { display: none; } }
    </style>
  </defs>
  <g mask="url(#cut)">
    <rect width="960" height="64" fill="#0B1220"/>
    <rect width="960" height="64" fill="url(#g)"/>
    <rect y="60" width="960" height="4" fill="url(#u)" opacity="0.8"/>
  </g>
  <line x1="92" y1="14" x2="92" y2="50" stroke="#8FA6C8" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round"/>
  <text class="m" x="46" y="20" font-size="10" font-weight="700" letter-spacing="2" fill="#8FA6C8" text-anchor="middle">Nº</text>
  <text class="m" x="46" y="50" font-size="30" font-weight="700" fill="#6FA8FF" text-anchor="middle" filter="url(#glow)">02</text>
  <text class="s" x="120" y="43" font-size="32" font-weight="800" letter-spacing="2.5" fill="#F2F7FF">FEATURED PROJECTS</text>
  <text class="m cap" x="930" y="38" font-size="14" letter-spacing="1" fill="#9FB2CC" text-anchor="end">Web · Mobile · Desktop</text>
</svg>
